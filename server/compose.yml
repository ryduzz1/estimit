services:
  api:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgres://estimit:${POSTGRES_PASSWORD}@db:5432/estimit
      ALLOW_INSTALLATION_REGISTRATION: ${ALLOW_INSTALLATION_REGISTRATION:-false}
      TRUST_TAILSCALE_IDENTITY: ${TRUST_TAILSCALE_IDENTITY:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ESTIMIT_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: estimit
      POSTGRES_USER: estimit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - estimit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimit -d estimit"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  estimit_postgres:
